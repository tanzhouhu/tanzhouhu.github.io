<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · Page not found — Zhouhu Tan</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin />
  <link href="https://fonts.bunny.net/css?family=inter:400,500,600,700|newsreader:400,500,600,700,700i" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/main.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="top-rule" aria-hidden="true"></div>

  <header class="nav">
    <div class="nav-inner">
      <a class="nav-brand" href="./">Zhouhu Tan<i>.</i></a>
      <div class="nav-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
          <svg class="icon-sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="nf">
    <div>
      <h1>404</h1>
      <h2>Page not found · 页面不存在</h2>
      <p>The page you're looking for doesn't exist or has been moved.</p>
      <a class="nf-link" href="./">← Back to homepage · 返回主页</a>
    </div>
  </main>

  <script>
    document.getElementById("themeToggle").addEventListener("click", function () {
      var isDark = document.documentElement.classList.toggle("dark");
      try { localStorage.setItem("theme", isDark ? "dark" : "light"); } catch (e) {}
    });
  </script>
</body>
</html>
